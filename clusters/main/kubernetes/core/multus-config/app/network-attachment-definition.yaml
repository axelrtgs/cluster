apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan
  namespace: multus-config
spec:
  # accept_ra_rt_info_max_plen=64 accepts the Route Information Option the Thread
  # border routers advertise; without it fd61::/64 is unreachable from the pod.
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "lan",
      "plugins": [
        {
          "type": "macvlan",
          "master": "${MACVLAN_MASTER}",
          "mode": "bridge",
          "ipam": {
            "type": "host-local",
            "subnet": "${MACVLAN_SUBNET}",
            "rangeStart": "${MACVLAN_RANGE_START}",
            "rangeEnd": "${MACVLAN_RANGE_END}",
            "gateway": "${MACVLAN_GATEWAY}",
            "routes": [
              { "dst": "${LAN_SUBNET}", "gw": "${MACVLAN_GATEWAY}" }
            ]
          }
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv6.conf.net1.accept_ra": "2",
            "net.ipv6.conf.net1.accept_ra_rt_info_max_plen": "64"
          }
        }
      ]
    }
