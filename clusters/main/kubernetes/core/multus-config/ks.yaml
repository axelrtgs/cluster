apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: multus-config
  namespace: flux-system
spec:
  interval: 10m
  path: clusters/main/kubernetes/core/multus-config/app
  prune: true
  dependsOn:
    - name: multus
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: false
