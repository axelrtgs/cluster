apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus-cni
  namespace: kube-system
spec:
  interval: 15m
  chart:
    spec:
      chart: multus-cni
      version: 2.12.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Keep in step with the node's Talos version; this image is where the
    # reference CNI binaries below are copied from.
    talosCniImage:
      repository: ghcr.io/siderolabs/cni
      tag: v1.13.0@sha256:0dc7609b62c2ab8f01d1adc7ea4b20a1b409d5cf895a94e9234e0eb91364da0c
    multus:
      integrations:
        talos:
          enabled: true
          # Enabling the Talos integration hands the chart ownership of these
          # binaries in /opt/cni/bin - it deletes them on uninstall.
          installCni:
            macvlan: true
            ipvlan: true
            tuning: true
