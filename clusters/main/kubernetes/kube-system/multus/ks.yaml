apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: multus
  namespace: flux-system
spec:
  interval: 10m
  path: clusters/main/kubernetes/kube-system/multus/app
  prune: true
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: true
