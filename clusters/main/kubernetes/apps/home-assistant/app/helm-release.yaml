---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/helm.toolkit.fluxcd.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: home-assistant
    namespace: home-assistant
spec:
    interval: 15m
    chart:
        spec:
            chart: home-assistant
            version: 31.2.0
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system

    postRenderers:
        - kustomize:
              patches:
                  - target:
                        group: postgresql.cnpg.io
                        version: v1
                        kind: Cluster
                    patch: |
                        - op: add
                          path: /spec/enablePDB
                          value: false
                  # The chart exposes no pod-annotation value, so the Multus
                  # attachment has to be patched in after rendering.
                  - target:
                        group: apps
                        version: v1
                        kind: Deployment
                        name: home-assistant
                    patch: |
                        apiVersion: apps/v1
                        kind: Deployment
                        metadata:
                            name: home-assistant
                        spec:
                            template:
                                metadata:
                                    annotations:
                                        k8s.v1.cni.cncf.io/networks: multus-config/lan

    values:
        TZ: America/Montreal
        cnpg:
            main:
                backups:
                    credentials: s3
                    enabled: true
                    retentionPolicy: ""
                    revision: "1"
                cluster:
                    instances: 2
                    singleNode: true
                database: home-assistant
                enabled: true
                hibernate: false
                mode: recovery
                monitoring:
                    disableDefaultQueries: false
                    enablePodMonitor: true
                password: PLACEHOLDERPASSWORD
                pgVersion: 16
                pooler:
                    enabled: false
                recovery:
                    enabled: true
                    revision: ""
                    credentials: s3
                user: home-assistant
        credentials:
            s3:
                type: s3
                url: "${S3URL}"
                bucket: "${S3BUCKET}"
                accessKey: "${S3ID}"
                secretKey: "${S3KEY}"
                encrKey: "${S3ENCRKEY}"
        ingress:
            main:
                enabled: true
                ingressClassName: external
                annotations:
                    nginx.ingress.kubernetes.io/configuration-snippet: |
                        proxy_set_header X-Forwarded-For "";
                        proxy_set_header X-Real-IP "";
                hosts:
                    - host: hass.${BASE_DOMAIN}
                      paths:
                        - path: /
                          pathType: Prefix
                integrations:
                    certManager:
                        certificateIssuer: domain-0-le-prod
                        enabled: true
        service:
            main:
                enabled: true
                ports:
                    main:
                        enabled: true
                        port: 8123
                        protocol: tcp
                        targetPort: 8123
                type: ClusterIP
        persistence:
            config:
                enabled: true
                mountPath: /config
                targetSelectAll: true
                volsync:
                    - credentials: s3
                      dest:
                        enabled: true
                      name: s3
                      src:
                        enabled: true
                      type: restic
