apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: matter-server
  labels:
    app.kubernetes.io/name: matter-server
spec:
  replicas: 1
  # RWO volume and a single macvlan address: never run two at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matter-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matter-server
      annotations:
        # net1 is a macvlan child of enp1s0, giving Matter the LAN presence its
        # mDNS and IPv6 link-local discovery need. eth0 stays on the cluster
        # network so the Service still reaches 5580.
        k8s.v1.cni.cncf.io/networks: multus-config/lan
    spec:
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:1.4.0@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
          # --primary-interface must be net1, not eth0: eth0 is the cluster network
          # and cannot reach Matter devices or carry mDNS.
          args:
            - --storage-path
            - /data
            - --primary-interface
            - net1
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=1536
            - name: TZ
              value: America/Montreal
          # Image default user is 1000:1000, but /data was written by the Python
          # server as root:root 0600 and the migration must be able to read it.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - name: websocket
              containerPort: 5580
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi
          # First boot converts the Python storage files to the matter.js format and
          # re-interviews every node, so the startup budget is 5min, not 2.
          startupProbe:
            tcpSocket:
              port: 5580
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 5580
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5580
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server-data
