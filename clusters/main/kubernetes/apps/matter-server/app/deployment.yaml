apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: matter-server
  labels:
    app.kubernetes.io/name: matter-server
spec:
  replicas: 1
  # hostNetwork + RWO volume: never run two at once, and never two on different nodes
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matter-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matter-server
    spec:
      # Matter discovery is mDNS + IPv6 link-local, neither of which survives NAT
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:1.4.0@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
          # --primary-interface picks the interface used for link-local mDNS; left
          # unset the server advertises on every host interface, of which this node
          # has ~100 thanks to one Cilium veth per pod.
          args:
            - --storage-path
            - /data
            - --primary-interface
            - enp1s0
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=1536
            - name: TZ
              value: America/Montreal
          # Image default user is 1000:1000, but /data was written by the Python
          # server as root:root 0600 and the migration must be able to read it.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - name: websocket
              containerPort: 5580
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi
          # First boot converts the Python storage files to the matter.js format and
          # re-interviews every node, so the startup budget is 5min, not 2.
          startupProbe:
            tcpSocket:
              port: 5580
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 5580
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5580
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server-data
