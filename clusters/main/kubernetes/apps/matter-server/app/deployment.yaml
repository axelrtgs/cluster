apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: matter-server
  labels:
    app.kubernetes.io/name: matter-server
spec:
  replicas: 1
  # hostNetwork + RWO volume: never run two at once, and never two on different nodes
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matter-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matter-server
    spec:
      # Matter discovery is mDNS + IPv6 link-local, neither of which survives NAT
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/python-matter-server:stable
          # Overriding args replaces the image CMD, so --storage-path must be repeated.
          # --primary-interface is what the SDK uses to pick link-local for mDNS; left
          # unset it logs "Using 'None' as primary interface" and fails to advertise.
          args:
            - --storage-path
            - /data
            - --primary-interface
            - enp1s0
          securityContext:
            privileged: true
          ports:
            - name: websocket
              containerPort: 5580
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 5580
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server-data
