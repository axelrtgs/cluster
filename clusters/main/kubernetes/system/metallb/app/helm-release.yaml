apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb
spec:
  interval: 5m
  chart:
    spec:
      chart: metallb
      version: 0.16.2
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          # hostNetwork + fixed webhook port 19443 on a single node: a surge pod can
          # never schedule beside the old one, so RollingUpdate deadlocks every upgrade.
          # The chart exposes no strategy value.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: metallb-frr-k8s-statuscleaner
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
  values:
    speaker:
      ignoreExcludeLB: true
